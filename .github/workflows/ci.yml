name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe_billing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cafe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://cafe:cafe@localhost:5432/cafe_billing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Tests
        run: python manage.py test --verbosity 2
