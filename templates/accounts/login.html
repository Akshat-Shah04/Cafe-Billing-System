<!DOCTYPE html>
<html lang="en">
<head>
  {% include "partials/_assets.html" %}
  <title>Login | {{ cafe.name }}</title>
</head>
<body class="login-page">
  <main class="w-100">
    <h4 class="text-white text-center mb-3"><b>{{ cafe.name }}</b></h4>
    <div class="row justify-content-center mx-0">
      <div class="card col-11 col-sm-8 col-md-5 col-lg-4">
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger">Username or password is incorrect.</div>
            {% endif %}
            <div class="form-group">
              <label for="id_username" class="control-label">Username</label>
              <input type="text" id="id_username" name="username" class="form-control" value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" autofocus required>
            </div>
            <div class="form-group">
              <label for="id_password" class="control-label">Password</label>
              <input type="password" id="id_password" name="password" class="form-control" autocomplete="current-password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <div class="text-center"><button class="btn btn-sm btn-block btn-primary col-md-5 mx-auto">Login</button></div>
          </form>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
