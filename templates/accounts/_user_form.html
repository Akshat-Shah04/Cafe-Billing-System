<div class="container-fluid">
  <form id="manage-user" novalidate autocomplete="off">
    <input type="hidden" name="id" value="{{ edit_user.pk|default_if_none:'' }}">
    <div class="form-group">
      <label for="u-name">Name</label>
      <input type="text" name="full_name" id="u-name" class="form-control" maxlength="150" value="{{ form.full_name.value|default_if_none:'' }}" required>
    </div>
    <div class="form-group">
      <label for="u-username">Username</label>
      <input type="text" name="username" id="u-username" class="form-control" maxlength="150" value="{{ form.username.value|default_if_none:'' }}" required>
    </div>
    <div class="form-group">
      <label for="u-password">Password</label>
      <input type="password" name="password" id="u-password" class="form-control" autocomplete="new-password">
      {% if edit_user %}<small class="form-text text-muted"><i>Leave this blank if you don't want to change the password.</i></small>
      {% else %}<small class="form-text text-muted">At least 8 characters, not too common and not all numbers.</small>{% endif %}
    </div>
    <div class="form-group mb-0">
      <label for="u-role">User Type</label>
      <select name="role" id="u-role" class="custom-select">
        {% for value, label in form.fields.role.choices %}
        <option value="{{ value }}" {% if form.role.value == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
  </form>
</div>
<script>
  $("#manage-user").on("submit", function (e) {
    e.preventDefault();
    post_and_reload("{% url 'accounts:user_save' %}", $(this).serialize(), "Data successfully saved.", $(this));
  });
</script>
